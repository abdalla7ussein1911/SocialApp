<nav class="sticky top-0 z-50 w-full border-b border-gray-100 bg-white shadow-sm">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <!-- Logo -->
    <a routerLink="/feed" class="flex items-center gap-3">
      <img
        src="/images/route.png"
        class="h-9 w-9 rounded-lg bg-blue-900 p-1 object-contain"
        alt="Route Logo"
      />
      <span class="whitespace-nowrap text-xl font-bold text-gray-900">
        Route Posts
      </span>
    </a>

    <!-- Navigation -->
    <div class="order-3 flex w-full justify-center md:order-none md:w-auto">
      <div class="flex items-center gap-1 rounded-2xl bg-gray-100/80 p-1.5">
        <!-- Feed -->
        <a
          routerLink="/feed"
          routerLinkActive="bg-white text-blue-600 shadow-sm"
          [routerLinkActiveOptions]="{ exact: true }"
          class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-semibold text-gray-600 transition hover:bg-white hover:text-gray-900 sm:px-4"
        >
          <svg
            class="h-4 w-4"
            fill="currentColor"
            viewBox="0 0 20 20"
            aria-hidden="true"
          >
            <path
              d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l1.293 1.293a1 1 0 001.414-1.414l-7-7z"
            />
          </svg>
          <span>Feed</span>
        </a>

        <!-- Profile -->
        <a
          routerLink="/profile"
          routerLinkActive="bg-white text-blue-600 shadow-sm"
          class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium text-gray-600 transition hover:bg-white hover:text-gray-900 sm:px-4"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
            />
          </svg>
          <span>Profile</span>
        </a>

        <!-- Notifications -->
        <a
          routerLink="/notification"
          routerLinkActive="bg-white text-blue-600 shadow-sm"
          class="relative flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium text-gray-600 transition hover:bg-white hover:text-gray-900 sm:px-4"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
          </svg>
          <span>Notifications</span>
          <span
            class="absolute -right-1 -top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white"
          >
            11
          </span>
        </a>
      </div>
    </div>

    <!-- User Profile & Dropdown -->
    <div class="relative">
      @if (userData()) {
        <button
          type="button"
          id="user-menu-button"
          aria-label="Open user menu"
          aria-expanded="false"
          data-dropdown-toggle="user-dropdown"
          data-dropdown-placement="bottom-end"
          class="flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-2 py-1.5 transition hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <!-- Profile Image -->
          <img
            class="h-8 w-8 rounded-full object-cover"
            [src]="
              userData()?.photo ||
              'https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png'
            "
            [alt]="userData()?.name || 'User photo'"
          />

          <!-- User Name -->
          <span
            class="hidden max-w-[140px] truncate text-sm font-semibold text-slate-800 md:block"
          >
            {{ userData()?.name || 'User' }}
          </span>

          <!-- Menu Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="text-slate-500"
            aria-hidden="true"
          >
            <path d="M4 5h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 19h16"></path>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div
          id="user-dropdown"
          class="z-50 my-2 hidden w-56 divide-y divide-gray-100 rounded-2xl border border-gray-100 bg-white text-base shadow-xl"
        >
          <!-- User Information -->
          <div class="px-4 py-3">
            <span class="block truncate text-sm font-bold text-gray-900">
              {{ userData()?.name || 'User' }}
            </span>

            <span class="mt-0.5 block truncate text-xs text-gray-500">
              {{ userData()?.email || '' }}
            </span>
          </div>

          <!-- Menu Items -->
          <ul class="py-2 text-sm text-gray-700">
            <li>
              <a
                routerLink="/profile"
                class="block px-4 py-2 transition hover:bg-gray-50"
              >
                Profile
              </a>
            </li>

            <li>
              <a
                routerLink="/change-password"
                class="block px-4 py-2 transition hover:bg-gray-50"
              >
                Settings · Change Password
              </a>
            </li>

            <li>
              <button
                type="button"
                (click)="logout()"
                class="block w-full px-4 py-2 text-left text-red-600 transition hover:bg-red-50"
              >
                Sign out
              </button>
            </li>
          </ul>
        </div>
      } @else {
        <a
          routerLink="/login"
          class="inline-flex items-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700"
        >
          Login
        </a>
      }
    </div>
  </div>
</nav>
