
<div class="grid grid-cols-1 gap-2 lg:grid-cols-12">

  <!-- Left Sidebar -->
  <aside class="hidden lg:col-span-2 lg:block">
    <div class="sticky top-20 rounded-2xl bg-white p-4 shadow-sm space-y-2">
      <button
        type="button"
        (click)="changeSection('feed')"
        [class.bg-blue-50]="activeSection() === 'feed'"
        [class.text-blue-600]="activeSection() === 'feed'"
        [class.font-medium]="activeSection() === 'feed'"
        class="w-full flex items-center gap-3 rounded-xl px-3 py-2 text-gray-600 hover:bg-gray-50"
      >
        <i class="fa-solid fa-house"></i>
        <span>Feed</span>
      </button>

      <button
        type="button"
        (click)="changeSection('my-posts')"
        [class.bg-blue-50]="activeSection() === 'my-posts'"
        [class.text-blue-600]="activeSection() === 'my-posts'"
        [class.font-medium]="activeSection() === 'my-posts'"
        class="w-full flex items-center gap-3 rounded-xl px-3 py-2 text-gray-600 hover:bg-gray-50"
      >
        <i class="fa-solid fa-hashtag"></i>
        <span>My Posts</span>
      </button>

      <button
        type="button"
        (click)="changeSection('community')"
        [class.bg-blue-50]="activeSection() === 'community'"
        [class.text-blue-600]="activeSection() === 'community'"
        [class.font-medium]="activeSection() === 'community'"
        class="w-full flex items-center gap-3 rounded-xl px-3 py-2 text-gray-600 hover:bg-gray-50"
      >
        <i class="fa-solid fa-users"></i>
        <span>Community</span>
      </button>

      <button
        type="button"
        (click)="changeSection('saved')"
        [class.bg-blue-50]="activeSection() === 'saved'"
        [class.text-blue-600]="activeSection() === 'saved'"
        [class.font-medium]="activeSection() === 'saved'"
        class="w-full flex items-center gap-3 rounded-xl px-3 py-2 text-gray-600 hover:bg-gray-50"
      >
        <i class="fa-regular fa-bookmark"></i>
        <span>Saved</span>
      </button>
    </div>
  </aside>

  <!-- Feed Content -->
  <main class="lg:col-span-7 lg:col-start-3">
    <app-createpost (postCreated)="loadPosts()"></app-createpost>

    <section class="mt-5 flex flex-col gap-6">
      @if (isBrowser) {
        @for (post of displayedPosts(); track post._id) {
          <app-post
            [onePost]="post"
            (postDeleted)="removePost($event)"
          ></app-post>
        }
      }
    </section>
  </main>

  <!-- Right Sidebar -->
  <aside class="hidden lg:col-span-3 lg:col-start-10 lg:block">
    <div class="sticky top-20">
      <app-suggested-friends></app-suggested-friends>
    </div>
  </aside>

</div>
