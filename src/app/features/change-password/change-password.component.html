<div class="mx-auto max-w-7xl px-3 py-3.5">
  <!-- Back to Feed -->
  <div class="mb-5">
    <a
      routerLink="/feed"
      class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-700 shadow-sm transition hover:border-[#1877f2] hover:text-[#1877f2]"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m15 18-6-6 6-6"></path>
      </svg>

      Back to Feed
    </a>
  </div>

  <main class="min-w-0">
    <div class="mx-auto max-w-2xl">
      <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
        <!-- Header -->
        <div class="mb-5 flex items-center gap-3">
          <span
            class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#e7f3ff] text-[#1877f2]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
              ></path>
              <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
            </svg>
          </span>

          <div>
            <h1 class="text-xl font-extrabold text-slate-900 sm:text-2xl">Change Password</h1>
            <p class="text-sm text-slate-500">
              Keep your account secure by using a strong password.
            </p>
          </div>
        </div>

        <!-- Success Message -->
        @if (successMessage()) {
          <div
            role="status"
            class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-3 py-2.5 text-sm text-emerald-700"
          >
            {{ successMessage() }}
          </div>
        }

        <!-- Error Message -->
        @if (errorMessage()) {
          <div
            role="alert"
            class="mb-4 rounded-xl border border-rose-200 bg-rose-50 px-3 py-2.5 text-sm text-rose-700"
          >
            {{ errorMessage() }}
          </div>
        }

        <!-- Change Password Form -->
        <form
          [formGroup]="passwordForm"
          (ngSubmit)="submitChangePassword()"
          novalidate
          class="space-y-4"
        >
          <!-- Current Password -->
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700"> Current password </span>

            <input
              type="password"
              formControlName="password"
              autocomplete="current-password"
              placeholder="Enter current password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
              [class.border-rose-500]="
                passwordForm.controls.password.touched && passwordForm.controls.password.invalid
              "
              [class.border-slate-200]="
                !(passwordForm.controls.password.touched && passwordForm.controls.password.invalid)
              "
            />

            @if (passwordForm.controls.password.touched && passwordForm.controls.password.invalid) {
              <span class="mt-1 block text-xs text-rose-600">
                Please enter your current password.
              </span>
            }
          </label>

          <!-- New Password -->
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700"> New password </span>

            <input
              type="password"
              formControlName="newPassword"
              autocomplete="new-password"
              placeholder="Enter new password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
              [class.border-rose-500]="
                passwordForm.controls.newPassword.touched &&
                passwordForm.controls.newPassword.invalid
              "
              [class.border-slate-200]="
                !(
                  passwordForm.controls.newPassword.touched &&
                  passwordForm.controls.newPassword.invalid
                )
              "
            />

            <span class="mt-1 block text-xs text-slate-500">
              At least 8 characters with uppercase, lowercase, number, and special character.
            </span>

            @if (
              passwordForm.controls.newPassword.touched &&
              passwordForm.controls.newPassword.hasError('required')
            ) {
              <span class="mt-1 block text-xs text-rose-600"> Please enter a new password. </span>
            } @else if (
              passwordForm.controls.newPassword.touched && passwordForm.controls.newPassword.invalid
            ) {
              <span class="mt-1 block text-xs text-rose-600">
                Your password does not meet the required conditions.
              </span>
            }
          </label>

          <!-- Confirm Password -->
          <label class="block">
            <span class="mb-1.5 block text-sm font-bold text-slate-700">
              Confirm new password
            </span>

            <input
              type="password"
              formControlName="confirmPassword"
              autocomplete="new-password"
              placeholder="Re-enter new password"
              class="w-full rounded-xl border bg-slate-50 px-3 py-2.5 text-sm text-slate-800 outline-none transition focus:border-[#1877f2] focus:bg-white"
              [class.border-rose-500]="
                passwordForm.controls.confirmPassword.touched &&
                passwordForm.controls.confirmPassword.invalid
              "
              [class.border-slate-200]="
                !(
                  passwordForm.controls.confirmPassword.touched &&
                  passwordForm.controls.confirmPassword.invalid
                )
              "
            />

            @if (
              passwordForm.controls.confirmPassword.touched &&
              passwordForm.controls.confirmPassword.invalid
            ) {
              <span class="mt-1 block text-xs text-rose-600">
                Please confirm your new password.
              </span>
            }
          </label>

          <button
            type="submit"
            [disabled]="isLoading() || passwordForm.invalid"
            [class.cursor-not-allowed]="isLoading() || passwordForm.invalid"
            [class.opacity-60]="isLoading() || passwordForm.invalid"
            [class.cursor-pointer]="!isLoading() && passwordForm.valid"
            class="inline-flex w-full items-center justify-center rounded-xl bg-[#1877f2] px-4 py-2.5 text-sm font-bold text-white transition hover:bg-[#166fe5] disabled:hover:bg-[#1877f2]"
          >
            @if (isLoading()) {
              Updating password...
            } @else {
              Update password
            }
          </button>
        </form>
      </section>
    </div>
  </main>
</div>
