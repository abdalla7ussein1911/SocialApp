
<main class="min-w-0">
  <div class="mx-auto max-w-3xl space-y-4">

    <!-- Back Button -->
    <button
      type="button"
      (click)="goBack()"
      class="inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-bold text-slate-700 transition hover:bg-slate-50"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </svg>
      Back
    </button>

    <!-- Loading -->
    @if (isLoading()) {
      <div class="rounded-xl border border-slate-200 bg-white py-16 text-center shadow-sm">
        <div class="mx-auto h-8 w-8 animate-spin rounded-full border-4 border-slate-200 border-t-blue-600"></div>
        <p class="mt-3 text-sm text-slate-500">Loading post...</p>
      </div>
    }

    <!-- Error -->
    @else if (errorMessage()) {
      <div class="rounded-xl border border-red-200 bg-white p-6 text-center shadow-sm">
        <p class="text-sm text-red-600">{{ errorMessage() }}</p>

        <button
          type="button"
          (click)="goBack()"
          class="mt-4 rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700"
        >
          Back to Feed
        </button>
      </div>
    }

    <!-- Post Details -->
    @else if (post(); as currentPost) {
      <article class="overflow-visible rounded-xl border border-slate-200 bg-white shadow-sm">

        <!-- Post Header, Content, Statistics and Actions -->
        <app-post
          [onePost]="currentPost"
          [detailsMode]="true"
        ></app-post>

        <!-- Comments Section -->
        <section class="border-t border-slate-200 p-4 sm:p-5">
          <div class="mb-4 flex items-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="21"
              height="21"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z" />
            </svg>

            <h2 class="text-base font-bold text-slate-900">
              Comments
            </h2>

            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-600">
              {{ currentPost.commentsCount ?? 0 }}
            </span>
          </div>

          <app-all-comments
            [postId]="currentPost._id"
            [showFullComments]="true"
          ></app-all-comments>
        </section>

      </article>
    }
  </div>
</main>
